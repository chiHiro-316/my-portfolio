<main>

    <h2>Contact</h2>

    
    
    
    <form action="https://ssgform.com/s/mY9mgoZBwRMu" method="POST" class="contact-form">
        
  <div class="form-item">
      <label for="name">お名前</label>
      <input type="text" id="name" name="name" required placeholder="山田 太郎">
  </div>

  <div class="form-item">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required placeholder="example@email.com">
    </div>
    
    <div class="form-item">
        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" rows="5" required placeholder="ご用件をご記入ください"></textarea>
    </div>
    
    <button type="submit" class="submit-btn">送信する</button>
    
</form>


  <!-- 戻るリンク -->
  <a href="index.html" class="back-link-home">HOME</a>

</main>
